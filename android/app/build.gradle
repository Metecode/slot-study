apply plugin: 'com.android.application'

/*
  Sürümün tek kaynağı package.json; artırmak için `npm version patch|minor|major`.
  versionCode ondan türetilir: major*10000 + minor*100 + patch (1.2.3 → 10203).
  Play her yüklemede daha büyük bir versionCode ister, semver arttıkça bu da artar.
  minor ya da patch 99'u aşarsa bir üst basamağa taşar (1.0.100 → 10100, yani
  1.1.0 ile aynı kod), bu yüzden derleme durur. Ön sürüm etiketi (-beta.1)
  sayıya çevrilemediği için o da durdurur.
*/
def appVersionName = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def versionMatch = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!versionMatch.matches()) {
    throw new GradleException("package.json sürümü \"${appVersionName}\" X.Y.Z biçiminde değil; versionCode türetilemiyor.")
}
def (versionMajor, versionMinor, versionPatch) = (1..3).collect { Integer.parseInt(versionMatch.group(it)) }
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("package.json sürümü ${appVersionName}: minor ve patch en fazla 99 olabilir " +
        "(versionCode = major*10000 + minor*100 + patch). Bir üst basamağı artır: npm version minor ya da npm version major.")
}
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

/*
  Release imzası android/keystore.properties'ten okunur (repoda yok, .gitignore'da).
  Dosya yoksa (başka makine, CI, yalnızca debug derleyen) derleme bozulmaz:
  release imzasız çıkar, release derlemesinin sonunda uyarı yazılır. Dosya var
  ama anahtar eksikse derleme durur; imzalamak isteyen sessizce imzasız pakete
  düşmesin. Değerler hiçbir mesaja yazılmaz.
  UTF-8 okunur: Properties.load(InputStream) Latin-1 varsayar ve Türkçe
  karakterli şifreyi bozardı. storeFile mutlak ya da android/'e göre göreli;
  .properties'te \ kaçış karakteri olduğundan Windows yolunda / kullanılır.
*/
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
    def missingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties.getProperty(it) }
    if (missingKeys) {
        throw new GradleException("android/keystore.properties'te eksik anahtar: ${missingKeys.join(', ')}")
    }
}

android {
    namespace = "com.meteucar.slot"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.meteucar.slot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword = keystoreProperties.getProperty('storePassword')
                keyAlias = keystoreProperties.getProperty('keyAlias')
                keyPassword = keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        /*
          Debug ayrı paket kimliğiyle kurulur ki Play'den gelen release
          (com.meteucar.slot) ile yan yana dursun; aynı kimlik ve farklı imzayla
          kurulum çakışıyordu. Ana ekrandaki "Slot Dev" adı src/debug/res'ten gelir.
          Ayrı paket ayrı veri demek: debug kendi IndexedDB'siyle boş başlar.
          Manifest'teki authority'ler ${applicationId} ile yazıldığı için suffix'i alır.
        */
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Uyarı derlemenin sonunda, "BUILD SUCCESSFUL"un hemen üstünde görünsün diye doLast'te.
if (!hasReleaseKeystore) {
    tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
        doLast {
            logger.warn("UYARI: android/keystore.properties bulunamadı, release paketi İMZASIZ derlendi. " +
                "Play Console imzasız paketi kabul etmez. İmzalamak için dosyaya storeFile, storePassword, " +
                "keyAlias ve keyPassword yaz.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
