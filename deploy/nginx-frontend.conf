# Konteyner içi nginx: yalnızca derlenmiş SPA'yı sunar.
# TLS, alan adı ve backend yönlendirmesi host nginx'inde.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Erişim günlüğü tutulmaz: yalnızca statik dosya sunuluyor, istek başına
    # IP ve yol kaydının bir karşılığı yok. Hatalar error_log'a düşmeye devam eder.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Host nginx'i proxy_pass'te varsayılan olarak HTTP/1.0 konuşur; gzip'in
    # varsayılanı 1.1 istediği için bu satır olmadan sıkıştırma hiç devreye girmez.
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite dosya adlarına içerik özeti ekliyor: içerik değişirse ad da değişir,
    # bu yüzden bu dosyalar bir yıl boyunca yeniden doğrulanmadan kullanılabilir.
    # Olmayan bir asset index.html'e düşmez, 404 döner — yoksa tarayıcı HTML'i
    # JavaScript diye çalıştırmaya çalışır.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html asset adlarını taşıyor; önbellekte eski kalırsa yeni deploy'dan
    # sonra silinmiş dosyaları ister. Her seferinde sunucuya sorulur.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA: service worker, kayıt betiği ve manifest özetsiz adla kökte duruyor.
    # Tarayıcı yeni sürümü sw.js'in değişip değişmediğine bakarak buluyor;
    # önbellekte eski kalırsa yeni deploy hiç fark edilmez. Her seferinde
    # sunucuya sorulur (304 ile ucuz). workbox-*.js'in adı özetli ama
    # /assets dışında, uzun önbellek kuralına girmiyor; sw.js ile aynı yerde
    # ele alınıyor. Olmayan dosya 404: HTML'i betik diye çalıştırmasın.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[\w-]+\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Bazı nginx sürümlerinin mime.types'ında .webmanifest yok; açıkça veriliyor.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Gizlilik sayfaları: React'in dışında, kendi HTML'leri var
    # (privacy/index.html, privacy/en/index.html). Sondaki / ile ve onsuz aynı
    # dosya doğrudan verilir, yönlendirme yok: konteyner nginx'i proxy
    # arkasında kendi port'uyla mutlak bir Location üretebilirdi. Sayfalardaki
    # bağlantı ve asset yolları mutlak, sondaki / göreli yolları bozmaz.
    # index.html gibi özetli CSS'e bağlı; her seferinde sunucuya sorulur.
    location ~ ^/privacy(?<privacy_lang>/en)?/?$ {
        add_header Cache-Control "no-cache";
        try_files /privacy$privacy_lang/index.html =404;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (o da yukarıdaki no-cache
    # bloğundan geçer).
    location / {
        try_files $uri /index.html;
    }
}
