# PR'larda frontend ve backend testleri. deploy.yml de testleri buradan
# çağırır (workflow_call), aynı adımlar iki yerde yazılmasın diye.
name: CI

on:
  pull_request:
    # Yalnızca kodu etkileyen değişikliklerde çalışır; docs/ ya da README
    # değişikliği test koşturmaz. src/content/ backend'i de etkiliyor:
    # soru içeriği backend jar'ına kopyalanıyor (bkz. backend/pom.xml).
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "scripts/**"
      - "tsconfig*.json"
      - "eslint.config.js"
      - "privacy/**"
      - "backend/**"
      - "Dockerfile.frontend"
      - ".dockerignore"
      - "deploy/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/**"
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Betiklerin ve içerik denetiminin tipleri; build'in tsc -b'si
      # yalnızca production projelerini kontrol ediyor.
      - run: npm run typecheck
      - run: npm test
      # tsc -b tip hatalarını da yakalar; derlenemeyen kod image'a gitmesin.
      - run: npm run build

  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvnw Windows'ta commit'lendiği için git'te çalıştırma izni yok.
      # Testcontainers runner'daki Docker'ı kullanır, ek kurulum gerekmez.
      - run: chmod +x mvnw && ./mvnw -B verify

  # Testler tam checkout'ta çalışıyor, Dockerfile'lar ise dosyaları tek tek
  # kopyalıyor: kopyalanmayan bir dosyaya bağımlılık testlerde görünmez,
  # yalnızca imajda düşer (PR #58'den sonra dört deploy böyle kaldı). Bu yüzden
  # PR'da iki image da push edilmeden derlenir. deploy.yml bu workflow'u
  # çağırdığında atlanır; orada build job'u aynı image'ları zaten derliyor.
  images:
    name: Image derlemesi (${{ matrix.image }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # Biri düşse de diğeri sonuna kadar derlensin, ikisinin durumu da görünsün.
      fail-fast: false
      matrix:
        include:
          - image: slot-frontend
            dockerfile: Dockerfile.frontend
          - image: slot-backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Bağlam ve cache kapsamı deploy.yml'deki ile aynı, böylece main'in
      # deploy cache'inden okur. Cache'e yazmaz: PR'ların cache'i depo
      # kotasında main'inkini itmesin.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
