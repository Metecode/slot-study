# main'e her push'ta: test -> image'ları derle ve ghcr.io'ya it -> sunucuya
# kur -> https://slot.meteucar.com/api/health ile doğrula.
# Etiket her zaman commit SHA'sı; "latest" yok, böylece sunucuda hangi
# sürümün çalıştığı ve neye geri dönüleceği her zaman belli.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Aynı anda iki deploy sunucuya yazmasın; yarıda kesilen deploy da olmasın,
# sonraki sıraya girer.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: Image derle (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: slot-frontend
            context: .
            dockerfile: Dockerfile.frontend
          - image: slot-backend
            context: .
            dockerfile: backend/Dockerfile
          - image: slot-backup
            context: backup
            dockerfile: backup/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # ghcr.io image adında büyük harf kabul etmiyor (Metecode -> metecode).
      - name: Image adını hazırla
        id: meta
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend ve backend bağlam olarak repo kökünü bekliyor (backend imajı
      # src/content/tr'yi de kopyalıyor); yedek imajı yalnızca backup/'ı.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.name }}:${{ github.sha }}
          # Frontend alt bilgideki commit kısaltması için okuyor; backend ve
          # yedek Dockerfile'ları bu arg'ı tanımlamıyor, orada etkisiz.
          build-args: GITHUB_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Sunucuya kur
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://slot.meteucar.com
    permissions:
      contents: read
      # Sunucu ghcr.io'dan bu job'un token'ıyla çeker (paketler özel olsa da).
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Host anahtarı VPS_KNOWN_HOSTS ile sabitleniyor. StrictHostKeyChecking=no
      # kullanılmıyor: araya giren biri kendi anahtarıyla bağlantıyı
      # devralabilir ve sunucuya giden token'ı görürdü.
      - name: SSH anahtarlarını kur
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Yollar burada mutlak hale getiriliyor: env: bloğuna yazılan ~ ya da
          # $HOME, $SSH_OPTS açılırken bash tarafından genişletilmez. echo
          # anında $HOME açılır, sonraki adımlar hazır yolu görür.
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Compose dosyasını kopyala
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: scp $SSH_OPTS docker-compose.prod.yml "$VPS_USER@$VPS_HOST:/opt/mulakat/docker-compose.prod.yml"

      # Betik stdin'den gidiyor: token komut satırında değil, sunucuda
      # `ps` çıktısında görünmez. Çekme bitince logout: token job'la birlikte
      # geçersiz olur zaten, sunucuda ölü kimlik bilgisi kalmasın.
      - name: Yeni sürümü başlat
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          cd /opt/mulakat
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull
          docker logout ghcr.io
          IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d
          echo ${{ github.sha }} >> deploy-history.txt
          docker image prune -af --filter "until=168h"
          EOF

      # up -d konteynerleri başlatıp döner; backend'in (Flyway dahil) ayağa
      # kalkması sürüyor. 3 dakika boyunca 5 saniyede bir denenir, 200
      # gelmezse deploy başarısız sayılır.
      - name: Sağlık kontrolü
        run: |
          for i in $(seq 1 36); do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://slot.meteucar.com/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Sağlık kontrolü geçti (deneme $i)."
              exit 0
            fi
            echo "Deneme $i: HTTP $status"
            sleep 5
          done
          echo "::error::https://slot.meteucar.com/api/health 3 dakika içinde 200 dönmedi. Geri alma: docs/deploy.md"
          exit 1
